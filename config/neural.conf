# SysTune Neural Executor Configuration
# This file dictates the thresholds used by the native Rust orchestrator
# to apply smart mitigations dynamically extracted from AI logs.

# Temperature threshold (in millidegrees) to trigger active background scanning
NEURAL_THERM_THRESHOLD=42000

# The niceness value to apply to rogue background processes consuming > 90% CPU during a thermal spike
NEURAL_RENICE_VAL=10

# Memory available percentage threshold to trigger safe page cache dropping
NEURAL_MEM_THRESH=15
